name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    env:
      # The loopback clients disable proxy discovery themselves; this keeps the
      # environment consistent with the test suite's expectation.
      NO_PROXY: 127.0.0.1,localhost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: pip install -e "backend[dev]"
      - name: Test
        working-directory: backend
        run: python -m pytest

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck and build
        run: npm run build
      - name: Rail grouping check
        run: npm run check:rail

  dsh-reporter:
    name: dsh reporter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/dsh-csd-plugin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Zero runtime dependencies, so there is nothing to install first.
      - name: Test
        run: npm test

  pi-reporter:
    name: pi reporter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/pi-csd-extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Zero runtime dependencies; the suite drives a fake ExtensionAPI and a fake client.
      - name: Test
        run: npm test
