[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cpctl"
version = "0.1.0"
description = "Reporting client for Agenest"
license = { text = "MIT" }
# 3.10, not 3.11: nothing here needs 3.11, and 3.10 is still what many agent hosts ship.
# A floor higher than the target machine is a floor that gets worked around with a vendored
# copy and an --ignore-requires-python flag, which is worse than a correct one.
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cpctl = "cpctl.cli:main"

[tool.setuptools]
packages = ["cpctl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "-q"
